<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BountyBook Signer — EOA personal_sign</title>
<style>
  body { font-family: monospace; background: #111; color: #eee; max-width: 720px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 18px; color: #7fd; }
  .box { background: #1c1c1c; border: 1px solid #333; padding: 12px; margin: 12px 0; word-break: break-all; }
  .label { color: #999; font-size: 12px; }
  button { background: #2d6; border: none; color: #000; font-weight: bold; padding: 14px 24px; font-size: 15px; cursor: pointer; margin-top: 10px; }
  button:disabled { background: #555; color: #999; cursor: not-allowed; }
  .warn { color: #f88; font-size: 13px; }
  #log { color: #7fa; font-size: 12px; max-height: 240px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>

<body>

<h1>BountyBook Signer — EOA personal_sign</h1>

<p class="warn">
Connect any EOA wallet, then approve ONE off-chain signature of the BountyBook nonce.
No transactions, approvals, transfers, or spending requests — ever.
</p>

<div class="box"><span class="label">Wallet address:</span><br><b id="addr">not connected</b></div>
<div class="box"><span class="label">Status:</span><br><b id="status">idle</b></div>

<button id="signin" onclick="doSignIn()">1. Connect &amp; Sign BountyBook Nonce</button>

<div class="box"><span class="label">Nonce:</span><br><b id="nonce">—</b></div>
<div class="box"><span class="label">Signature:</span><br><b id="sig">—</b></div>

<div id="err" class="warn"></div>
<div class="box"><span class="label">Diagnostics:</span><pre id="log"></pre></div>

<!-- Base Account SDK: works with EOA wallets via standard EIP-1193 personal_sign,
     and its provider falls back cleanly for plain injected wallets too. -->
<script src="https://unpkg.com/@base-org/account@2.5.10/dist/base-account.min.js"></script>

<script>
function log(m) {
  const el = document.getElementById("log");
  el.textContent += new Date().toISOString().slice(11, 19) + " " + m + "\n";
  el.scrollTop = el.scrollHeight;
  console.log("[signer]", m);
}
function setError(m) { document.getElementById("err").textContent = m || ""; }
function setStatus(m) { document.getElementById("status").textContent = m; }

// Prefer an injected EOA wallet (MetaMask/Coinbase ext/Rabby) if present;
// otherwise use the Base Account SDK popup provider.
let provider = null;

function getProvider() {
  if (provider) return provider;
  if (window.ethereum && !window.ethereum.isBaseAccountSDK) {
    log("using injected wallet provider");
    provider = window.ethereum;
  } else {
    log("using Base Account SDK provider");
    provider = window.createBaseAccountSDK({ appName: "BountyBook Signer" }).getProvider();
  }
  return provider;
}

function withTimeout(p, ms, label) {
  return Promise.race([
    p,
    new Promise((_, rej) => setTimeout(() => rej(new Error(label + " timed out after " + ms / 1000 + "s")), ms))
  ]);
}

function utf8ToHex(str) {
  return "0x" + Array.from(new TextEncoder().encode(str))
    .map(b => b.toString(16).padStart(2, "0")).join("");
}

async function fetchNonce(address) {
  const r = await fetch("/api/nonce?address=" + encodeURIComponent(address));
  if (!r.ok) throw new Error("Nonce fetch failed: HTTP " + r.status);
  const nonce = (await r.json()).nonce;
  document.getElementById("nonce").textContent = nonce;
  log("nonce: " + nonce);
  return nonce;
}

async function doSignIn() {
  setError("");
  setStatus("Connecting...");
  document.getElementById("signin").disabled = true;

  try {
    const p = getProvider();

    // 1. Connect (standard EIP-1193 — works with any EOA)
    log("requesting eth_requestAccounts...");
    const accounts = await withTimeout(p.request({ method: "eth_requestAccounts" }), 180000, "connect");
    const address = accounts[0];
    document.getElementById("addr").textContent = address;
    log("connected: " + address);

    // 2. Fresh nonce for THIS address
    const nonce = await fetchNonce(address);

    // 3. EIP-191 personal_sign of the RAW nonce string (BountyBook's proven contract).
    //    Send as plain UTF-8 text first; some providers want hex — try hex on rejection.
    setStatus("Requesting signature...");
    let signature;
    try {
      signature = await withTimeout(p.request({
        method: "personal_sign",
        params: [nonce, address]
      }), 180000, "personal_sign");
    } catch (e1) {
      log("plain-text params rejected (" + (e1?.message || e1) + ") — retrying hex-encoded");
      signature = await withTimeout(p.request({
        method: "personal_sign",
        params: [utf8ToHex(nonce), address]
      }), 180000, "personal_sign(hex)");
    }

    if (!signature) throw new Error("Wallet returned no signature.");
    document.getElementById("sig").textContent = signature;
    log("signature: " + signature.slice(0, 20) + "...");

    // 4. Verify
    setStatus("Verifying with BountyBook...");
    const vres = await fetch("/api/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ address, signature })
    });
    const vtext = await vres.text();
    log("verify HTTP " + vres.status + ": " + vtext.slice(0, 300));

    let vdata = {};
    try { vdata = JSON.parse(vtext); } catch (_) {}
    if (!vres.ok) {
      throw new Error(vdata?.error || ("BountyBook verification failed: HTTP " + vres.status));
    }

    setStatus("✅ BountyBook authentication successful. Token: " + (vdata.token || "received"));

  } catch (error) {
    console.error(error);
    log("ERROR: " + (error?.message || String(error)));
    setError("Sign-in failed: " + (error?.message || String(error)));
    setStatus("failed");
  } finally {
    document.getElementById("signin").disabled = false;
  }
}

window.doSignIn = doSignIn;
log("page loaded — connect any EOA wallet");
</script>

</body>
</html>
